<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContentLens — Text Detector Playground</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-card: #151b2c;
            --border-color: #242f4c;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            
            --color-ai: #ef4444;       /* Red */
            --color-human: #10b981;    /* Green */
            --color-uncertain: #6b7280;/* Gray */
            
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'Space Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        input[type="text"] {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: rgba(11, 15, 25, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="text"]:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        textarea {
            width: 100%;
            min-height: 180px;
            padding: 1rem;
            background-color: rgba(11, 15, 25, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 0.95rem;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background-color: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background-color: #4f46e5;
        }

        .btn:active {
            transform: scale(0.985);
        }

        .btn:disabled {
            background-color: var(--border-color);
            color: var(--text-secondary);
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .result-card {
            margin-top: 2rem;
            border-top: 1px solid var(--border-color);
            padding-top: 2rem;
            display: none;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .verdict-badge {
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .verdict-ai {
            background-color: rgba(239, 68, 68, 0.15);
            color: var(--color-ai);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .verdict-human {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--color-human);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .verdict-uncertain {
            background-color: rgba(107, 114, 128, 0.15);
            color: var(--color-uncertain);
            border: 1px solid rgba(107, 114, 128, 0.3);
        }

        .score-container {
            margin-bottom: 1.5rem;
        }

        .score-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .score-bar-bg {
            width: 100%;
            height: 10px;
            background-color: #0b0f19;
            border-radius: 9999px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .score-bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 9999px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .meta-info {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }

        .error-message {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 8px;
            color: #f87171;
            font-size: 0.9rem;
            display: none;
        }

        footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>ContentLens</h1>
            <p>AI Content Detector Playground</p>
        </header>

        <div class="form-group">
            <label for="endpoint">Railway API Endpoint URL</label>
            <input type="text" id="endpoint" value="https://content-lens-production-5f31.up.railway.app">
        </div>

        <div class="form-group">
            <label for="text">Text Content to Analyze</label>
            <textarea id="text" placeholder="Paste your text paragraph here (minimum 10 characters)..."></textarea>
        </div>

        <button id="check-btn" class="btn" onclick="checkContent()">
            <span class="spinner" id="spinner"></span>
            <span id="btn-text">Analyze Content</span>
        </button>

        <div class="error-message" id="error-box"></div>

        <div class="result-card" id="result-card">
            <div class="result-header">
                <h3>Verdict</h3>
                <span class="verdict-badge" id="verdict-badge">AI Generated</span>
            </div>

            <div class="score-container">
                <div class="score-header">
                    <span>Confidence Score</span>
                    <span id="score-text">85%</span>
                </div>
                <div class="score-bar-bg">
                    <div class="score-bar-fill" id="score-bar-fill"></div>
                </div>
            </div>

            <div class="meta-info">
                <span>Model: <span id="model-version">text-v1</span></span>
                <span>Classification: <span id="verdict-detail">AI</span></span>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 ContentLens ML Playground &bull; Stay Authentic</p>
    </footer>

    <script>
        async function checkContent() {
            const endpointInput = document.getElementById('endpoint');
            const textInput = document.getElementById('text');
            const checkBtn = document.getElementById('check-btn');
            const btnText = document.getElementById('btn-text');
            const spinner = document.getElementById('spinner');
            const errorBox = document.getElementById('error-box');
            const resultCard = document.getElementById('result-card');
            
            const verdictBadge = document.getElementById('verdict-badge');
            const scoreText = document.getElementById('score-text');
            const scoreBarFill = document.getElementById('score-bar-fill');
            const modelVersionEl = document.getElementById('model-version');
            const verdictDetail = document.getElementById('verdict-detail');

            // Reset UI
            errorBox.style.display = 'none';
            resultCard.style.display = 'none';
            scoreBarFill.style.width = '0%';

            const textVal = textInput.value.trim();
            const endpointVal = endpointInput.value.trim().replace(/\/$/, "");

            if (textVal.length < 10) {
                showError("Please enter at least 10 characters to analyze.");
                return;
            }

            if (!endpointVal) {
                showError("Please enter a valid Railway API endpoint URL.");
                return;
            }

            // Set loading state
            checkBtn.disabled = true;
            btnText.textContent = "Analyzing...";
            spinner.style.display = 'inline-block';

            try {
                const response = await fetch(`${endpointVal}/detect/text`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: textVal })
                });

                if (!response.ok) {
                    throw new Error(`API returned status ${response.status}: ${await response.text()}`);
                }

                const data = await response.json();
                
                // Show results card
                resultCard.style.display = 'block';

                // Map verdict
                const verdict = data.verdict; // ai_generated | human | uncertain
                const confidenceFloat = data.confidence || 0.0;
                const confidencePct = Math.round(confidenceFloat * 100);
                const modelVersion = data.model_version || 'unknown';

                modelVersionEl.textContent = modelVersion;
                scoreText.textContent = `${confidencePct}%`;
                
                // Animate bar fill
                setTimeout(() => {
                    scoreBarFill.style.width = `${confidencePct}%`;
                }, 50);

                // Clear classes and apply based on verdict
                verdictBadge.className = 'verdict-badge';
                
                if (verdict === 'ai_generated') {
                    verdictBadge.textContent = 'AI Generated';
                    verdictBadge.classList.add('verdict-ai');
                    verdictDetail.textContent = 'Likely AI';
                    scoreBarFill.style.backgroundColor = 'var(--color-ai)';
                } else if (verdict === 'human') {
                    verdictBadge.textContent = 'Human Written';
                    verdictBadge.classList.add('verdict-human');
                    verdictDetail.textContent = 'Likely Human';
                    scoreBarFill.style.backgroundColor = 'var(--color-human)';
                } else {
                    verdictBadge.textContent = 'Uncertain';
                    verdictBadge.classList.add('verdict-uncertain');
                    verdictDetail.textContent = 'Indeterminate';
                    scoreBarFill.style.backgroundColor = 'var(--color-uncertain)';
                }

            } catch (err) {
                console.error(err);
                showError(`Failed to connect to gateway: ${err.message}. Make sure your Railway service is running and CORS is enabled.`);
            } finally {
                // Restore button
                checkBtn.disabled = false;
                btnText.textContent = "Analyze Content";
                spinner.style.display = 'none';
            }
        }

        function showError(msg) {
            const errorBox = document.getElementById('error-box');
            errorBox.textContent = msg;
            errorBox.style.display = 'block';
        }
    </script>
</body>
</html>
