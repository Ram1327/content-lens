name: ML CI

on:
  push:
    paths:
      - "apps/ml-service/**"
  pull_request:
    paths:
      - "apps/ml-service/**"

jobs:
  test-lint:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/ml-service/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r apps/ml-service/requirements.txt
          pip install -r apps/ml-service/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check apps/ml-service

      - name: Test (pytest)
        run: pytest apps/ml-service/tests -v
